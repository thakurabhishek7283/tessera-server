name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # Clones and builds the tessera repo (@tessera/protocol) at the ref pinned in deps.json.
      - run: node scripts/fetch-deps.mjs --ci
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --tag tessera-server:ci .
      - name: Smoke test (read-only filesystem, non-root)
        run: |
          docker run --detach --name tessera --read-only --tmpfs /tmp \
            --volume tessera-data:/data --publish 8787:8787 tessera-server:ci
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/health; then
              echo
              docker stop --time 10 tessera
              exit 0
            fi
            sleep 1
          done
          docker logs tessera
          exit 1
